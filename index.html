<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhysioCare</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">PhysioCare</div></header>

<main>
  <!-- مرحله ۱: فقط انتخاب سطح -->
  <section id="levelPage" class="screen">
    <div class="hero">
      <div class="badge">کتابخانه تمرین‌های فیزیوتراپی</div>
      <h1>سطح تمرین را انتخاب کنید</h1>
      <p>برای ادامه، یکی از سطوح زیر را انتخاب کنید.</p>
    </div>

    <div class="levels">
      <button class="level easy" onclick="chooseLevel('آسان')">
        <span class="emoji">🌱</span>
        <strong>آسان</strong>
        <small>مناسب شروع توانبخشی و حرکات سبک</small>
      </button>
      <button class="level medium" onclick="chooseLevel('متوسط')">
        <span class="emoji">⚡</span>
        <strong>متوسط</strong>
        <small>تمرین‌های با شدت و چالش بیشتر</small>
      </button>
      <button class="level hard" onclick="chooseLevel('سخت')">
        <span class="emoji">🔥</span>
        <strong>سخت</strong>
        <small>تمرین‌های پیشرفته‌تر و چالش‌برانگیز</small>
      </button>
    </div>
  </section>

  <!-- مرحله ۲: فقط بعد از انتخاب سطح نمایش داده می‌شود -->
  <section id="bodyPage" class="screen hidden">
    <button class="back" onclick="backToLevels()">← بازگشت</button>
    <div class="hero compact">
      <div class="badge" id="levelBadge"></div>
      <h1>قسمت بدن را انتخاب کنید</h1>
      <p>تمرین‌های موردنظر را از بین قسمت‌های بدن انتخاب کنید.</p>
    </div>

    <div class="body-grid">
      <button class="body-card">🧠<strong>سر و صورت</strong></button>
      <button class="body-card">🦷<strong>فک و مفصل گیجگاهی</strong></button>
      <button class="body-card">🦴<strong>گردن</strong></button>
      <button class="body-card">💪<strong>شانه</strong></button>
      <button class="body-card">🦾<strong>بازو و آرنج</strong></button>
      <button class="body-card">✋<strong>دست و مچ دست</strong></button>
      <button class="body-card">🫁<strong>قفسه سینه</strong></button>
      <button class="body-card">🧍<strong>ستون فقرات و کمر</strong></button>
      <button class="body-card">🫃<strong>شکم و لگن</strong></button>
      <button class="body-card">🦵<strong>مفصل ران</strong></button>
      <button class="body-card">🦵<strong>زانو</strong></button>
      <button class="body-card">🦶<strong>ساق و مچ پا</strong></button>
      <button class="body-card">🦶<strong>پا و انگشتان پا</strong></button>
      <button class="body-card">🏃<strong>تعادل و راه رفتن</strong></button>
      <button class="body-card">🧘<strong>تمرین‌های کل بدن</strong></button>
    </div>
  </section>
</main>

<footer>PhysioCare • تمرین‌های فیزیوتراپی</footer>
<script src="script.js"></script>
</body>
</html>
